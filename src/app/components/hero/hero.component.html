<section class="hero" id="hero" aria-label="Hero section">
  <!-- Layer 1: Three.js Canvas -->
  <canvas #heroCanvas class="hero-canvas" aria-hidden="true"></canvas>

  <!-- Layer 2: Radial gradient overlay -->
  <div class="hero-overlay" aria-hidden="true"></div>

  <!-- Layer 3: Content — 2-column layout -->
  <div class="hero-container">

    <!-- LEFT: Photo -->
    <div class="hero-photo-wrap" aria-label="Photo of Husnain Raza">
      <div class="photo-frame">
        <!-- Glow rings -->
        <div class="photo-ring photo-ring-1" aria-hidden="true"></div>
        <div class="photo-ring photo-ring-2" aria-hidden="true"></div>

        <!-- Photo -->
        <div class="photo-inner">
          <img
            src="assets/husnain.jpeg"
            alt="Husnain Raza — Full Stack & AI Developer"
            class="hero-photo"
            loading="eager">
        </div>

        <!-- Open to Work badge -->
        <div class="open-to-work" aria-label="Open to work">
          <span class="otw-dot" aria-hidden="true"></span>
          Open to Work
        </div>
      </div>
    </div>

    <!-- RIGHT: Text -->
    <div class="hero-text">
      <!-- Available badge -->
      <div class="hero-eyebrow">
        <span class="eyebrow-dot" aria-hidden="true"></span>
        Available for Internships &amp; Projects
      </div>

      <!-- Greeting -->
      <p class="hero-greeting">Hi, I'm</p>

      <!-- Name -->
      <h1 class="hero-name">
        <span class="name-first">Husnain</span>
        <span class="name-last gradient-text">Raza</span>
      </h1>

      <!-- Role — Typed.js -->
      <div class="hero-role-line" aria-live="polite">
        <span id="typed-role" aria-label="Current role"></span>
      </div>

      <!-- Dynamic headline — cycles -->
      <div class="hero-headline-wrap" aria-live="polite">
        <span id="typed-headline" class="hero-headline"></span>
      </div>

      <!-- Subtitle -->
      <p class="hero-subtitle">
        Angular &bull; Python &bull; AI &mdash; turning complex problems into
        scalable, production-grade solutions.
      </p>

      <!-- Currently typed -->
      <div class="hero-typed" aria-live="polite">
        <span class="typed-prefix">⟶</span>
        <span id="typed-text" class="typed-currently"></span>
      </div>

      <!-- CTAs -->
      <div class="hero-ctas">
        <a
          href="#projects"
          class="btn btn-primary"
          (click)="scrollToProjects($event)"
          aria-label="View my projects">
          View My Work
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </a>
        <button
          class="btn btn-ghost"
          (click)="downloadResume()"
          aria-label="Download Husnain's resume">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          Resume
        </button>
        <a
          href="#contact"
          class="btn btn-ghost"
          (click)="scrollToContact($event)"
          aria-label="Contact Husnain">
          Let's Connect
        </a>
      </div>

      <!-- Mini stats -->
      <div class="hero-stats">
        <div class="hero-stat">
          <span class="stat-num">3+</span>
          <span class="stat-lbl">Internships</span>
        </div>
        <div class="stat-divider" aria-hidden="true"></div>
        <div class="hero-stat">
          <span class="stat-num">4+</span>
          <span class="stat-lbl">Projects</span>
        </div>
        <div class="stat-divider" aria-hidden="true"></div>
        <div class="hero-stat">
          <span class="stat-num">3.99</span>
          <span class="stat-lbl">CGPA</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Scroll Indicator -->
  <div class="scroll-indicator" aria-hidden="true">
    <div class="scroll-chevrons">
      <svg class="chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M6 9l6 6 6-6"/>
      </svg>
      <svg class="chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M6 9l6 6 6-6"/>
      </svg>
    </div>
  </div>
</section>
